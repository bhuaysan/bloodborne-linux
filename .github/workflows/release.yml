# Publishes the GitHub release of a release tag vX.Y.Z (docs/releasing.md): builds the portable
# package with tools/package-portable.sh, writes SHA256SUMS and the notes
# (tools/release/notes.py: docs/releases/<tag>.md, then the PRs since the previous release) and
# creates the release with both files.
#
# Only the maintainer pushes release tags. A failed run publishes nothing; re-run it once the
# cause is fixed on the tagged commit's side (a flaky download), or move the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The base the package is built on decides the oldest glibc it runs with. Fedora 44 like
    # CI for now; an older base is #737.
    container:
      image: fedora:44
    permissions:
      contents: write  # gh release create
      actions: read    # the CI runs of the tagged commit
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # What the portable preset needs (tools/package-portable.sh, cmake/portable.cmake): the
      # release preset's build tools without the test packages, the static libstdc++, the headers
      # of SDL's backends, nasm, make and perl for FFmpeg, and gh for the release.
      - name: Install build tools
        run: |
          dnf -y --setopt=install_weak_deps=False install git cmake ninja-build gcc-c++ make \
              python3 spirv-headers-devel vulkan-headers glslang vulkan-loader-devel \
              fontconfig-devel libstdc++-static pkgconf-pkg-config nasm perl diffutils xz tar gzip \
              wayland-devel libxkbcommon-devel libdecor-devel libX11-devel libXext-devel \
              libXcursor-devel libXi-devel libXfixes-devel libXrandr-devel libXtst-devel \
              pipewire-devel pulseaudio-libs-devel alsa-lib-devel gh

      # The whole history: the version (cmake/version.cmake) and the notes need the tags and main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout belongs to another user than the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::$TAG is not a release tag vMAJOR.MINOR.PATCH"
              exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
              echo "::error::$TAG is not on main"
              exit 1
          fi
          if [[ ! -f docs/releases/$TAG.md ]]; then
              echo "::error::docs/releases/$TAG.md is missing"
              exit 1
          fi
          # An annotated tag would publish the tagger's name and address (docs/releasing.md).
          if [[ $(git cat-file -t "refs/tags/$TAG") != commit ]]; then
              echo "::error::$TAG is an annotated tag: push a lightweight one"
              exit 1
          fi

      # Only a commit whose CI run on main passed is released.
      - name: Check CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '[.[] | select(.status == "completed")][0].conclusion // "none"')
          if [[ $conclusion != success ]]; then
              echo "::error::CI on main for $GITHUB_SHA: $conclusion (wait for it to pass, then re-run)"
              exit 1
          fi

      - name: Build the package
        run: tools/package-portable.sh dist

      # The programs report the tag as their version: a clean build of exactly the tagged commit.
      - name: Check the version
        run: |
          ls dist
          test -f "dist/Bloodborne-Linux-$TAG-x86_64.tar.gz"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/notes.py "$TAG" --repo "$GITHUB_REPOSITORY" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file notes.md "dist/Bloodborne-Linux-$TAG-x86_64.tar.gz" dist/SHA256SUMS
