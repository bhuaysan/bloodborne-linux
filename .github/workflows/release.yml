# Publishes the GitHub release of a release tag vX.Y.Z (docs/releasing.md): checks the tag and
# CI, builds the portable package in the Steam Runtime 3 "sniper" SDK with
# tools/package-portable.sh (the AppImage and the tar.gz), writes SHA256SUMS and the notes
# (tools/release/notes.py: docs/releases/<tag>.md, then the PRs since the previous release) and
# creates the release with the AppImage first, the tar.gz and SHA256SUMS.
#
# Only the maintainer pushes release tags. A failed run publishes nothing; re-run it once the
# cause is fixed on the tagged commit's side (a flaky download, CI still running), or move the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the CI runs of the tagged commit
    steps:
      # The whole history: the checks need the tags and main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::$TAG is not a release tag vMAJOR.MINOR.PATCH"
              exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
              echo "::error::$TAG is not on main"
              exit 1
          fi
          if [[ ! -f docs/releases/$TAG.md ]]; then
              echo "::error::docs/releases/$TAG.md is missing"
              exit 1
          fi
          # An annotated tag would publish the tagger's name and address (docs/releasing.md).
          if [[ $(git cat-file -t "refs/tags/$TAG") != commit ]]; then
              echo "::error::$TAG is an annotated tag: push a lightweight one"
              exit 1
          fi

      # Only a commit whose CI run on main passed is released.
      - name: Check CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '[.[] | select(.status == "completed")][0].conclusion // "none"')
          if [[ $conclusion != success ]]; then
              echo "::error::CI on main for $GITHUB_SHA: $conclusion (wait for it to pass, then re-run)"
              exit 1
          fi

  package:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The build base decides the oldest glibc the package starts on: the sniper SDK (Debian 11,
    # glibc 2.31, GCC 14) is Valve's base for Linux games (docs/releasing.md, "Build base"). The
    # same digest as tools/release/build-package.sh.
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:bb30053d3cd19d35c76ae69b2790dbaa1430448006f8240cb6d7e723f2d1940e
    steps:
      # The whole history: the version (cmake/version.cmake) needs the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout belongs to another user than the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # sniper-setup.sh adds nasm and CMake and sets GCC 14 and BB_GLIBC_MAX, which makes
      # package-portable.sh fail for a package that needs a newer glibc.
      - name: Build the package
        run: |
          # In two steps: eval "$(...)" would hide the script's failure.
          env=$(tools/release/sniper-setup.sh)
          eval "$env"
          test -n "${BB_GLIBC_MAX:-}"
          tools/package-portable.sh dist

      # The programs report the tag as their version: a clean build of exactly the tagged commit.
      - name: Check the version
        run: |
          ls dist
          test -f "dist/Bloodborne-Linux-$TAG-x86_64.AppImage"
          test -f "dist/Bloodborne-Linux-$TAG-x86_64.tar.gz"
          (cd dist && sha256sum -- "Bloodborne-Linux-$TAG-x86_64.AppImage" \
              "Bloodborne-Linux-$TAG-x86_64.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: package
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true  # "Re-run all jobs" uploads it again

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release create
    steps:
      # The whole history: the notes need the previous release tag and main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package
          path: dist

      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/notes.py "$TAG" --repo "$GITHUB_REPOSITORY" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file notes.md "dist/Bloodborne-Linux-$TAG-x86_64.AppImage" \
              "dist/Bloodborne-Linux-$TAG-x86_64.tar.gz" dist/SHA256SUMS
