# Builds the CMake presets (all three on main, debug and release on PRs),
# runs the unit tests and checks the commits of a PR (or a push to main) with
# tools/privacy-check.sh. On main it also builds on Ubuntu, Debian and Arch.
#
# CI never has the game: BB_GAME_DIR is unset and the checkout has no
# local.env, so tests that need the game skip.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the PR's run still going; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change needs the build: a PR that only changes docs doesn't.
  # docs/source-policy.md is the exception, a test reads its hash table.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ -n "$PR_BASE" ]; then
              # Without renames, so that a file moved into docs/ shows its old
              # path too. Captured first: grep -q leaving a pipe early would
              # fail git with SIGPIPE under pipefail.
              files=$(git diff --name-only --no-renames "$PR_BASE...HEAD")
              if ! printf '%s\n' "$files" | grep -vE '^docs/|^[^/]+\.md$' >/dev/null &&
                 ! printf '%s\n' "$files" | grep -x 'docs/source-policy.md' >/dev/null; then
                  code=false
              fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          # The distro check of the portable package: on main, and on PRs that change the package.
          package=true
          if [ -n "$PR_BASE" ] && ! printf '%s\n' "$files" | grep -E '^(cmake/portable\.cmake|tools/package-portable\.sh|tools/distro-check\.sh|tools/release/|\.github/workflows/ci\.yml)' >/dev/null; then
              package=false
          fi
          echo "package=$package" | tee -a "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.preset }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Fedora 44, the reference machine's distribution: its Vulkan headers,
    # lavapipe, SPIR-V tools, LLVM and SDL3 are what the code is written
    # against. Ubuntu 24.04's are too old (no VK_KHR_shader_maximal_reconvergence
    # in its Vulkan headers, no SDL3 package). Privileged, so that the step
    # below can lower the host's mmap randomisation.
    container:
      image: fedora:44
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        # relwithdebinfo compiles about what release does; PRs leave it out,
        # main builds all three.
        preset: ${{ fromJSON(github.event_name == 'push' && '["debug","relwithdebinfo","release"]' || '["debug","release"]') }}
    env:
      # ccache through the launcher variables CMake reads; the cache directory
      # is kept per preset between runs (actions/cache below).
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 500M
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
      # git first, so that the checkout is a repository: the tests ask git for
      # the main checkout (tests/CMakeLists.txt).
      # spirv-headers is a build dependency of the shader translator. The
      # Vulkan loader, lavapipe (mesa-vulkan-drivers), spirv-tools and llvm-mc
      # run its execution, validation and corpus tests (docs/formats/shader-binary.md).
      # SDL3 is for the window, presentation, sound and the pad. FFmpeg decodes
      # the movies and MP3 behind AJM (docs/design/os-libraries.md, #456).
      - name: Install build tools
        run: |
          dnf -y --setopt=install_weak_deps=False install git cmake ninja-build gcc-c++ \
              libasan libubsan gtest-devel python3 spirv-headers-devel spirv-tools \
              vulkan-headers glslang vulkan-loader-devel mesa-vulkan-drivers llvm SDL3-devel \
              ffmpeg-free-devel ccache tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The checkout belongs to another user than the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Each run saves its own entry and starts from the newest one of its
      # preset (PRs also see main's).
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Check the graphics packages
        run: |
          test -f /usr/include/spirv/unified1/spirv.hpp11
          command -v spirv-val
          command -v llvm-mc
          test -f /usr/include/vulkan/vulkan.h
          ls /usr/share/vulkan/icd.d/lvp_icd*.json
          test -f /usr/include/SDL3/SDL.h
          # Whether the memfd can take huge pages here (#549).
          grep -H . /sys/kernel/mm/transparent_hugepage/shmem_enabled \
              /sys/kernel/mm/transparent_hugepage/hugepages-*/shmem_enabled || true

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DBB_WERROR=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build --preset "${{ matrix.preset }}"
          ccache --show-stats

      # The runner kernels use 32 bits of mmap randomisation, with which
      # AddressSanitizer's shadow memory can collide with randomly placed
      # mappings, so the tests die at startup. 28 bits is the older kernel
      # default. The setting belongs to the host kernel; the container is
      # privileged to change it (the image has no sysctl).
      - name: Lower mmap randomisation for AddressSanitizer
        if: matrix.preset == 'debug'
        run: echo 28 > /proc/sys/vm/mmap_rnd_bits

      # run-tests.sh runs the Python tests too and builds the debug preset
      # itself (already built above, so that step is a no-op).
      - name: Test (Python and C++)
        if: matrix.preset == 'debug'
        run: tools/run-tests.sh

      - name: Test (C++)
        if: matrix.preset != 'debug'
        run: ctest --preset "${{ matrix.preset }}" --no-tests=error

  # The release preset built from source with the packages of other distributions
  # (docs/distributions.md, tools/distro-build.sh): another GCC and other system headers than
  # Fedora's. On main only, as it takes long; a PR that changes the build runs it by hand
  # (tools/distro-build.sh <distro>).
  distros:
    name: distro (${{ matrix.distro }})
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: tools/distro-build.sh --jobs 4 "${{ matrix.distro }}"

  # The portable package started on each distribution R12 supports, in a fresh container with only
  # the Vulkan loader, lavapipe and fontconfig (tools/distro-check.sh, docs/distributions.md).
  # Built as the release builds it (release.yml, job package).
  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:bb30053d3cd19d35c76ae69b2790dbaa1430448006f8240cb6d7e723f2d1940e
    steps:
      # The whole history: the version (cmake/version.cmake) needs the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the package
        run: |
          env=$(tools/release/sniper-setup.sh)
          eval "$env"
          tools/package-portable.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: portable-package
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  distro-check:
    name: distro-check (${{ matrix.distro }}${{ matrix.leave_out && format(' without {0}', matrix.leave_out) || '' }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora44, ubuntu2204, ubuntu2404, debian12, debian13, arch, bazzite]
        leave_out: ['']
        include:
          # The check notices a missing library. A new job: it replaces the empty leave_out.
          - distro: debian13
            leave_out: libfontconfig1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: portable-package
          path: dist

      - name: Check the package
        env:
          DISTRO: ${{ matrix.distro }}
          LEAVE_OUT: ${{ matrix.leave_out }}
        run: tools/distro-check.sh ${LEAVE_OUT:+--leave-out "$LEAVE_OUT"} "$DISTRO" dist/*.tar.gz

  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the whole history, so the range base is present
          fetch-depth: 0
          # the PR's own head, not the merge commit GitHub makes for it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check the commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
              base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
               git rev-parse -q --verify "$PUSH_BEFORE^{commit}" >/dev/null; then
              base="$PUSH_BEFORE"
          else
              # a push without a usable previous tip: check the last commit
              base=HEAD^
          fi
          # privacy-check.sh wants every commit by the configured identity,
          # a GitHub noreply address. The runner has none configured, so
          # take the head commit's author; the check then fails if any
          # commit in the range differs or the address isn't noreply.
          # The personal patterns in .git/info/privacy-patterns are local
          # only; CI checks the generic ones.
          git config user.name "$(git log -1 --format=%an HEAD)"
          git config user.email "$(git log -1 --format=%ae HEAD)"
          tools/privacy-check.sh "$base"
