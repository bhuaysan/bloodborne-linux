# Builds every CMake preset, runs the unit tests and checks the commits of
# a PR (or a push to main) with tools/privacy-check.sh.
#
# CI never has the game: BB_GAME_DIR is unset and the checkout has no
# local.env, so tests that need the game skip.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # Fedora 44, the reference machine's distribution: its Vulkan headers,
    # lavapipe, SPIR-V tools, LLVM and SDL3 are what the code is written
    # against. Ubuntu 24.04's are too old (no VK_KHR_shader_maximal_reconvergence
    # in its Vulkan headers, no SDL3 package). Privileged, so that the step
    # below can lower the host's mmap randomisation.
    container:
      image: fedora:44
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, relwithdebinfo, release]
    steps:
      # git first, so that the checkout is a repository: the tests ask git for
      # the main checkout (tests/CMakeLists.txt).
      # spirv-headers is a build dependency of the shader translator. The
      # Vulkan loader, lavapipe (mesa-vulkan-drivers), spirv-tools and llvm-mc
      # run its execution, validation and corpus tests (docs/design/graphics.md).
      # SDL3 is for the window and presentation code.
      - name: Install build tools
        run: |
          dnf -y --setopt=install_weak_deps=False install git cmake ninja-build gcc-c++ \
              libasan libubsan gtest-devel python3 spirv-headers-devel spirv-tools \
              vulkan-headers vulkan-loader-devel mesa-vulkan-drivers llvm SDL3-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The checkout belongs to another user than the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the graphics packages
        run: |
          test -f /usr/include/spirv/unified1/spirv.hpp11
          command -v spirv-val
          command -v llvm-mc
          test -f /usr/include/vulkan/vulkan.h
          ls /usr/share/vulkan/icd.d/lvp_icd*.json
          test -f /usr/include/SDL3/SDL.h

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DBB_WERROR=ON

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      # The runner kernels use 32 bits of mmap randomisation, with which
      # AddressSanitizer's shadow memory can collide with randomly placed
      # mappings, so the tests die at startup. 28 bits is the older kernel
      # default. The setting belongs to the host kernel; the container is
      # privileged to change it (the image has no sysctl).
      - name: Lower mmap randomisation for AddressSanitizer
        if: matrix.preset == 'debug'
        run: echo 28 > /proc/sys/vm/mmap_rnd_bits

      # run-tests.sh runs the Python tests too and builds the debug preset
      # itself (already built above, so that step is a no-op).
      - name: Test (Python and C++)
        if: matrix.preset == 'debug'
        run: tools/run-tests.sh

      - name: Test (C++)
        if: matrix.preset != 'debug'
        run: ctest --preset "${{ matrix.preset }}" --no-tests=error

  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the whole history, so the range base is present
          fetch-depth: 0
          # the PR's own head, not the merge commit GitHub makes for it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check the commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
              base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
               git rev-parse -q --verify "$PUSH_BEFORE^{commit}" >/dev/null; then
              base="$PUSH_BEFORE"
          else
              # a push without a usable previous tip: check the last commit
              base=HEAD^
          fi
          # privacy-check.sh wants every commit by the configured identity,
          # a GitHub noreply address. The runner has none configured, so
          # take the head commit's author; the check then fails if any
          # commit in the range differs or the address isn't noreply.
          # The personal patterns in .git/info/privacy-patterns are local
          # only; CI checks the generic ones.
          git config user.name "$(git log -1 --format=%an HEAD)"
          git config user.email "$(git log -1 --format=%ae HEAD)"
          tools/privacy-check.sh "$base"
